# conda environment for RAWREAD_QC_cleanifier on K-BDS (CentOS 7.9, glibc 2.17)
#   conda env create -f kbds_env.yml            # creates ~/.conda/envs/metacrc-qc
# If the solver reports a package that "requires __glibc >= 2.28" (or similar),
# that package has no glibc-2.17 build: see docs/RAWREAD_QC_cleanifier.md (fallbacks).
name: metacrc-qc
channels:
  - conda-forge
  - bioconda
dependencies:
  - python >=3.12          # Cleanifier needs >=3.12
  - cleanifier >=1.3.2     # gapped k-mer human-read filter (numba)
  - htslib >=1.17          # provides bgzip, used by cleanifier for .gz input/output
  - fastp >=0.23
  - nextflow >=24.10       # pulls openjdk >=17 from conda-forge
  - coreutils              # mktemp -p, stat -c (any CentOS 7 build is fine too)
  - procps-ng              # pkill/pgrep used by the shared-memory loader cleanup
